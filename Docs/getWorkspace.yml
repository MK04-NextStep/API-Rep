/workspace/workspaceList/{workspaceId}:
  get:
    summary: Get workspace
    description: Get workspace

    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string

    security:
      - bearerAuth: []

    responses:
      '200':
        description: Workspace retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  $ref: './openApi.yaml#/components/schemas/Workspace'

      '400':
        description: Invalid WorkspaceId
        content:
          application/json:
            schema:
              $ref: './openApi.yaml#/components/schemas/Error'

      '401':
        description: Unauthorized token
        content:
          application/json:
            schema:
              $ref: './openApi.yaml#/components/schemas/Error'

      '403':
        description: User is not part of workspace or user is not authorized
        content:
          application/json:
            schema:
              $ref: './openApi.yaml#/components/schemas/Error'

      '404':
        description: User not found or workspace not found
        content:
          application/json:
            schema:
              $ref: './openApi.yaml#/components/schemas/Error'