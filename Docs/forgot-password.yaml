/auth/forgot-password:
  post:
    summary: send email to reset password

    requestBody:
      required: true
      content: 
        application/json:
          schema:
            type: object
            required:
              - email
            properties:
              email:
                type: string
                format: email

    responses:
      '200':
        description: otp send successfully
        content:
          application/json:
            schema:
              $ref: './openApi.yaml#/components/schemas/Error'

      '400':
        description: invalid data
        content:
          application/json:
            schema:
              $ref: './openApi.yaml#/components/schemas/Error'

      '404':
        description: invalid email
        content:
          application/json:
            schema:
              $ref: './openApi.yaml#/components/schemas/Error'

      '409':
        description: please try after sometimes
        content:
          application/json:
            schema:
              $ref: './openApi.yaml#/components/schemas/Error'