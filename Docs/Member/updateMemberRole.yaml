/member/update-member-role/{workspaceId}:
  patch:
    summary: update member role

    security:
      bearerAuth: []

    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
    
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - memberId
              - role
            properties:
              memberId:
                type: string
              role:
                type: string
                enum: ["admin", "developer", "viewer"]

    responses:
      '200':
        description: user updated successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

      '400':
        description: invalid data
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/Error'
              
      '403':
        description: user is not part of worksapce
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/Error'

      '404':
        description: workspace not found, or user not found
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/Error'