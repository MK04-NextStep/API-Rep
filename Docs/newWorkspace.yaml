/workspace/new:
  post:
    summary: create new workspace

    security: 
      bearerAuth: []

    requestBody: 
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name: 
                type: string
              description:
                type: string
              type: 
                type: string
                enum: ['personal', 'team']
    
    responses:
      '200':
        description: worksapce created successfully
        content:
          application/json:
            schema: 
              type: object
              properties:
                success: 
                  type: boolean
                data: 
                  $ref: './openApi.yaml#/components/schemas/Workspace'

      '400':
        description: invalid data
        content:
          application/json:
            schema: 
              $ref: './openApi.yaml#/components/schemas/Error' 