/auth/profile-pic:
  patch:
    summary: update profile pic

    security:
      bearerAuth: []

    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
            properties:
              file:
                type: string
                format: binary

    responses:
      '200':
        description: profile pic updated successfully
        content:
          application/json:
            schema:
              $ref: './openApi.yaml#/components/schemas/Error'

      '400':
        description: invalid file
        content:
          application/json:
            schema:
              $ref: './openApi.yaml#/components/schemas/Error'