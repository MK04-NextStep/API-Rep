/api/{workspaceId}:
  get:
    summary: get api list according to workspace

    security:
      bearerAuth: []

    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string

    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              page:
                type: integer
                minimum: 1
              limit:
                type: integer
                minimum: 1
              method:
                type: string
                enum:  ["POST","GET","PATCH","DELETE","PUT","OPTIONS","HEAD"]
              status:
                type: string
                enum: ["draft","active","deprecated","archived"]
              search:
                type: string
              sort:
                type: string
    
    responses:
      '200':
        description: get api list successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Api'
                pagination:
                  $ref: './openApi.yaml#/components/schemas/Pagination'

      '400':
        description: invalid data
        content:
          application/json:
            schema: 
              $ref: './openApi.yaml#/components/schemas/Error'
              
      '403':
        description: user is not part of worksapce
        content:
          application/json:
            schema: 
              $ref: './openApi.yaml#/components/schemas/Error'

      '404':
        description: workspace not found
        content:
          application/json:
            schema: 
              $ref: './openApi.yaml#/components/schemas/Error'
    