/workspace/generate-report/{workspaceId}:
  get:
    summary: generate report of workspace

    security: 
      bearerAuth: []

    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string

    responses:
      '200':
        description: report generation started successfully
        content:
          application/json:
            schema: 
              type: object
              properties: 
                success:
                  type: boolean
                message:
                  type: string
                data:
                  $ref: './openApi.yaml#/components/schemas/Report'

      '400':
        description: invalid data
        content:
          application/json:
            schema: 
              $ref: './openApi.yaml#/components/schemas/Error'
              
      '403':
        description: user is not part of worksapce
        content:
          application/json:
            schema: 
              $ref: './openApi.yaml#/components/schemas/Error'

      '404':
        description: workspace not found
        content:
          application/json:
            schema: 
              $ref: './openApi.yaml#/components/schemas/Error'