/auth/refresh:
  post:
    summary: refresh the access tokens

    parameters:
      -in: cookie
      name: refreshToken
      required: true
      schema:
        type: string
      description:  Refresh token used to end the user's session.

    security: 
      bearerAuth: []

    responses: 
      '200':
        description: send access token successfully
        content:
          application/json:
            schema:
              type: object
              properties: 
                success: 
                  type: boolean
                accessToken:
                  type: string

      '401':
        description: invalid token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'