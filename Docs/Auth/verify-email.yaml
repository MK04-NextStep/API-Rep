/auth/verify-email:
  post:
    summary: verify the email

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - otp
            properties:
              email:
                type: string
                format: email
              otp:
                type: string

    responses:
      '200':
        description: user register successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

      '400':
        description: invalid data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

      '404':
        description: otp expires or invalid otp or user not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
