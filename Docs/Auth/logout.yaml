/auth/logout:
  post:
    summary: user logout

    parameters:
      -in: cookie
      name: refreshToken
      required: true
      schema:
        type: string
      description:  Refresh token used to end the user's session.
    
    security:
      bearerAuth: []

    responses:
      '200':
        description: user logout successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

      '401':
        description: invalid token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'    