/auth/reset-password:
  post:
    summary: reset user password

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - password
              - otp
            properties:
              email:
                type: string
                format: email
              password:
                type: string
                format: password
              otp:
                type: string

    responses:
      '200':
        description: password reset successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

      '400':
        description: invalid data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

      '404':
        description: invalid credentials
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

      '401':
        description: invalid otp
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'