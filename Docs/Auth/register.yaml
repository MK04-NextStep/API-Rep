/auth/register:
  post:
    summary: Register user

    requestBody:
      required: true
      content: 
        multipart/form-data:
          schema: 
            type: object
            requried:
              -name
              -email
              -password
            properties:
              name:
                type: string
              email:
                type: string
                format: email
              password:
                type: string
                format: password
              file:
                type: string
                format: binary

    responses:
      
      '200':
        description: user register successfully and verify your email
        content:
          application/json:
            schema:
              # $ref: '#/components/schemas/Error'
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message: 
                  type: string
      
      '409':
        description: user already existed
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      
      '400':
        description:  Validation error. The request contains invalid or missing fields.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
