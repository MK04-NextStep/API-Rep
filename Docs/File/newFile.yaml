/file/upload/{workspaceId}:
  post:
    summary: upload file

    security:
      bearerAuth: []

    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string

    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
            properties:
              file:
                type: string
                format: binary

    responses:
      '200':
        description: file uploaded successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

      '400':
        description: invalid data, or invalid file
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/Error'
              
      '403':
        description: user is not part of worksapce
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/Error'

      '404':
        description: workspace not found
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/Error'