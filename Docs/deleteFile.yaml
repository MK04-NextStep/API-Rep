/file/{workspaceId}/{fileId}:
  delete:
    summary: delete file
  
    security:
      bearerAuth: []

    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: fileId
        in: path
        required: true
        schema:
          type: string

    responses:
      '200':
        description: file deleted successfully
        content:
          application/json:
            schema:
              $ref: './openApi.yaml#/components/schemas/Error'

      '400':
        description: invalid data
        content:
          application/json:
            schema: 
              $ref: './openApi.yaml#/components/schemas/Error'
              
      '403':
        description: user is not part of worksapce
        content:
          application/json:
            schema: 
              $ref: './openApi.yaml#/components/schemas/Error'

      '404':
        description: workspace not found, or invalid file
        content:
          application/json:
            schema: 
              $ref: './openApi.yaml#/components/schemas/Error'