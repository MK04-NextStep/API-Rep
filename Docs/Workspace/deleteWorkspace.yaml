/workspace/delete/{workspaceId}:
  delete:
    summary: delete workspace

    security: 
      bearerAuth: []

    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string

    responses:
      '200':
        description: worksapce deleted successfully
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/Error'

      '400':
        description: invalid data
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/Error'
              
      '403':
        description: user is not part of worksapce
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/Error'

      '404':
        description: workspace not found
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/Error'