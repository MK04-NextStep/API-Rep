/member/delete-member/{workspaceId}:
  delete:
    summary: delete member of workspace

    security:
      bearerAuth: []

    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
    
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - memberId
            properties:
              memberId:
                type: string

    responses:
      '200':
        description: member deleted successfully
        content:
          application/json:
            schema:
              $ref: './openApi.yaml#/components/schemas/Error'

      '400':
        description: invalid data
        content:
          application/json:
            schema: 
              $ref: './openApi.yaml#/components/schemas/Error'
              
      '403':
        description: user is not part of worksapce
        content:
          application/json:
            schema: 
              $ref: './openApi.yaml#/components/schemas/Error'

      '404':
        description: workspace not found
        content:
          application/json:
            schema: 
              $ref: './openApi.yaml#/components/schemas/Error'